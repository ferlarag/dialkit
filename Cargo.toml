[workspace]
resolver = "3"
members = ["crates/client-core", "crates/api-generated", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ferlarag/dialkit"
authors = ["Fernando Lara <89590031+ferlarag@users.noreply.github.com>"]

[workspace.dependencies]
async-stream = "0.3.6"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
hmac = "0.12.1"
http = "1.3.1"
quick-xml = "0.38.3"
rand = "0.9.2"
reqwest = { version = "0.12.25", default-features = false, features = ["json"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_repr = "0.1.20"
serde_with = { version = "3.14.1", default-features = false, features = ["base64", "std", "macros"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.47.1", features = ["time"] }
tracing = "0.1.44"
url = "2.5.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
