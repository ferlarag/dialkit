name: Twilio specification drift

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch candidate without adopting it
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/twilio/twilio-oai.git /tmp/twilio-oai
          git -C /tmp/twilio-oai checkout --detach origin/main -- \
            spec/json/twilio_api_v2010.json \
            spec/json/twilio_messaging_v1.json
          git -C /tmp/twilio-oai rev-parse HEAD > upstream-commit.txt
          diff -u codegen/spec/twilio_api_v2010.json /tmp/twilio-oai/spec/json/twilio_api_v2010.json > upstream-api-v2010.diff || true
          diff -u codegen/spec/twilio_messaging_v1.json /tmp/twilio-oai/spec/json/twilio_messaging_v1.json > upstream-messaging-v1.diff || true
          cp codegen/coverage/twiml-nodes.toml candidate-twiml-nodes.toml
          cp codegen/coverage/webhook-families.toml candidate-webhook-families.toml
      - uses: actions/upload-artifact@v4
        with:
          name: twilio-coverage-drift
          path: |
            upstream-commit.txt
            upstream-api-v2010.diff
            upstream-messaging-v1.diff
            candidate-twiml-nodes.toml
            candidate-webhook-families.toml
      - name: Confirm report-only behavior
        run: |
          git diff --exit-code -- . \
            ':!upstream-commit.txt' \
            ':!upstream-api-v2010.diff' \
            ':!upstream-messaging-v1.diff' \
            ':!candidate-twiml-nodes.toml' \
            ':!candidate-webhook-families.toml'
